name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    # Desktop integration tests use Windows ctypes APIs.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PERSONAL_WORKBENCH_DISABLE_SCHEDULER: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PERSONAL_WORKBENCH_DISABLE_SCHEDULER: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Existing browser tests start an isolated Python service via this Windows path.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv ../.venv
      - run: ../.venv/Scripts/python.exe -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npx playwright install chromium
      - name: Frontend dependencies ready
        id: frontend_ready
        run: Write-Output "Frontend dependencies installed"
      - name: Vitest
        run: npm test
      # Run all checks after successful setup, even when another check fails.
      # Each failed check still marks the job red.
      - name: Typecheck
        if: ${{ !cancelled() && steps.frontend_ready.outcome == 'success' }}
        run: npm run typecheck
      - name: Build
        if: ${{ !cancelled() && steps.frontend_ready.outcome == 'success' }}
        run: npm run build
      - name: Playwright E2E
        id: e2e
        if: ${{ !cancelled() && steps.frontend_ready.outcome == 'success' }}
        run: npm run qa:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
