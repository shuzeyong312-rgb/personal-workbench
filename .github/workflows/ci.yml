name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERSONAL_WORKBENCH_DISABLE_SCHEDULER: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PERSONAL_WORKBENCH_DISABLE_SCHEDULER: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Existing browser tests start an isolated Python service via this Windows path.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv ../.venv
      - run: ../.venv/Scripts/python.exe -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run qa:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
